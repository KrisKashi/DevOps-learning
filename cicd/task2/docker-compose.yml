version: '3.8'

services:
  web:
    image: flask-redis-app:v1
    expose:
    - "5002"
    environment:
      - REDIS_HOST=redisdb
      - REDIS_PORT=6379
      - REDIS_DB=0
    depends_on:
      - redisdb
  
  nginx:
    image: nginx:latest
    ports:
    - "5002:5002"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
    - web



  redisdb:
    image: redis:latest
    ports:
    - "6379:6379"
    environment:
      - REDIS_ARGS=--appendonly yes
    
    volumes:
      - redis-data:/data
     
volumes:
  redis-data:
