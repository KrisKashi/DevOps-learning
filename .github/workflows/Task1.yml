name: CI Application Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd/task1

    steps:
    - name: checkout code
      uses: actions/checkout@v2

    - name: setup python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: install linters
      run: pip install ruff

    - name: Run ruff
      run: ruff check .

    - name: Run application
      run: python app.py
      
    - name: Build docker image from app
      uses: docker/build-push-action@v7
      with:
        context: ./cicd/task1
        push: false
        tags: CIbuild:latest
        
    - name: run docker container
      run: docker run cibuild:latest     
