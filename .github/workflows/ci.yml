name: Coderco Secrets lab

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v2

    - name: use secret
      run: echo "the secret is ${{ secrets.MY_SECRET }}"


    - name: use ENV secret
      run: echo "The secret is $MY_SECRET"
      env:
        MY_SECRET: ${{ secrets.MY_SECRET }}