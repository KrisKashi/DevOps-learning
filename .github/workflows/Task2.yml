name: CD deployment ECR

on:
    push:
    workflow_dispatch:
    pull_request:
          
        
permissions:
    id-token: write        

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: cicd/task2

        steps:
        - name: checkout code
          uses: actions/checkout@v2

        - name: setup python
          uses: actions/setup-python@v7
          with:
            python-version: '3.13'

        - name: install linters
          run: pip install ruff
          
        - name: run ruff
          run: ruff check .

        - name: Build docker image from app
          uses: docker/build-push-action@v7
          with:
            context: ./cicd/task2
            push: false
            tags: cdbuild:latest

        - name: run docker compose multi container
          working-directory: cicd/task2
          run: docker compose up -d
        
        - name: check if containers functional
          working-directory: cicd/task2
          run: docker compose ps


        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6.2.3
          with:
            role-to-assume: ${{ vars.ECR_ROLE }}
            aws-region: eu-west-2
        
        - name: Login to ECR
          id: ecr-login
          uses: aws-actions/amazon-ecr-login@v2    

        - name: Add/rebuild container to ECR
          run: |
            docker build -t $ECR_REGISTRY/flask-docker-cd:latest .
            docker push $ECR_REGISTRY/flask-docker-cd:latest
          env:
            ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}      





          