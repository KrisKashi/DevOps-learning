name: CD deployment ECR

on:
    push:
    workflow_dispatch:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: cicd/task2

        steps:
        - name: checkout code
          uses: actions/checkout@v2

        - name: setup python
          uses: actions/setup-python@v7
          with:
            python-version: '3.13'

        - name: install linters
          run: pip install ruff
          
        - name: run ruff
          run: ruff check .

        - name: Build docker image from app
          uses: docker/build-push-action@v7
          with:
            context: ./cicd/task2
            push: false
            tags: cdbuild:latest

          